<div class="portfolio-card">
  <h2>Experience</h2>
  <div>
    <div class="experience" *ngFor="let experience of experiences">
      <div class="experience-title">
        <h3>
          {{ experience.companyName }}, <i>{{ experience.position }}</i>
        </h3>
        <h3>{{ experience.startDate }} - {{ experience.endDate }}</h3>
      </div>
      <div class="experience-description">
        <ul>
          <li *ngFor="let des of experience.descriptions" [innerHTML]="des"></li>
        </ul>
      </div>
      <div class="experience-key-techs" *ngIf="experience.keyTechs">
        <h4>Technologies:&nbsp;</h4>
        <div *ngFor="let tech of experience.keyTechs; index as i;">
          <p *ngIf="i < experience.keyTechs.length - 1">{{ tech }},&nbsp;</p>
          <p *ngIf="i === experience.keyTechs.length - 1">{{ tech }}.</p>
        </div>
      </div>
    </div>
  </div>
</div>
